name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
      title:
        description: "Release title"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" \
            --notes "Paper: tex/main.tex (main.pdf), More Than 67.31 Percent of the Zeta Zeros Are Simple and on the Critical Line. Verification: verify/ (kernel table in 128-bit ball arithmetic, branch-and-bound certificates of the eight-zero window: weights of Table I, c0 = 19/4000, 21,067,790,614 nodes, giving 0.6731985970; uniform weights, 10,039,560,518 nodes) and checks/. The Riemann hypothesis is not proved. Authors: Deep Bhattacharjee (ORCID 0000-0003-0466-750X; itsdeep@live.com, d.bhattacharjee@erl-forschung.de), Ushashi Bhattacharya (ORCID 0009-0002-2254-3914)."
